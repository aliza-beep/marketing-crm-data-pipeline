name: Simulated marketing pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=marketing_pipeline --cov-report=term-missing
      - name: Run seven-day simulated ETL
        env:
          DATABASE_URL: sqlite:///data/marketing.db
          WEBHOOK_SECRET: ci-placeholder-not-for-production
        run: |
          python -m marketing_pipeline.pipeline --days 7
          python -m marketing_pipeline.export
          python -m marketing_pipeline.ai.diagnostics --no-ai
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-power-bi-dataset-and-diagnostics
          path: |
            data/exports/
            logs/diagnostic_summary.json
          retention-days: 7

